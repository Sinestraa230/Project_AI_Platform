# =====================================================================
# Action dùng chung: kiểm tra một bản app đang chạy có hoạt động đầu-cuối không.
#   1. Chờ GET <api-url>/health trả {"status":"ok"}
#   2. (tuỳ chọn) GET <frontend-url>/ trả trang React (có id="root")
#   3. (tuỳ chọn) POST /api/detections (giả lập kết quả trình duyệt đã chẩn đoán, kèm 1 ảnh)
#      -> GET /api/history thấy đúng bản ghi -> DELETE bản ghi để dọn dẹp
#      => chứng minh FE/BE/DB nối với nhau: ghi được và đọc lại được từ DB
#
# Dùng ở: integration.yml (local trong runner) và deploy.yml (bản production).
# =====================================================================
name: Smoke test API
description: Kiểm tra /health, trang frontend và luồng detections -> history

inputs:
  api-url:
    description: Địa chỉ backend (http://localhost:8000 hoặc https://plant-backend.vercel.app)
    required: true
  frontend-url:
    description: Địa chỉ frontend; để trống = dùng api-url (khi nginx phục vụ cả hai)
    default: ""
  wait-seconds:
    description: Chờ tối đa bao lâu để /health sẵn sàng
    default: "300"
  check-frontend:
    description: '"true" để kiểm tra GET / trả trang React'
    default: "true"
  check-detections:
    description: '"true" để thử ghi 1 kết quả chẩn đoán rồi đọc lại và xoá'
    default: "true"

runs:
  using: composite
  steps:
    - name: Smoke test
      shell: bash
      env:
        API_URL: ${{ inputs.api-url }}
        FRONTEND_URL: ${{ inputs.frontend-url }}
        WAIT_SECONDS: ${{ inputs.wait-seconds }}
        CHECK_FRONTEND: ${{ inputs.check-frontend }}
        CHECK_DETECTIONS: ${{ inputs.check-detections }}
      run: |
        set -euo pipefail
        API_URL="${API_URL%/}"
        FRONTEND_URL="${FRONTEND_URL:-$API_URL}"; FRONTEND_URL="${FRONTEND_URL%/}"
        json() { python3 -c "import sys, json; d = json.load(sys.stdin); print($1)"; }

        # ---- 1. /health ------------------------------------------------
        echo "⏳ Chờ $API_URL/health (tối đa ${WAIT_SECONDS}s)..."
        deadline=$(( $(date +%s) + WAIT_SECONDS ))
        until body=$(curl -fsS --max-time 30 "$API_URL/health" 2>/dev/null) \
              && [ "$(echo "$body" | json 'd.get("status")')" = "ok" ]; do
          if [ "$(date +%s)" -ge "$deadline" ]; then
            echo "::error::$API_URL/health không trả status=ok sau ${WAIT_SECONDS}s"
            exit 1
          fi
          sleep 10
        done
        echo "✅ /health: $body"
        echo "$body" > "$RUNNER_TEMP/health.json"

        # ---- 2. Frontend -----------------------------------------------
        if [ "$CHECK_FRONTEND" = "true" ]; then
          html=$(curl -fsSL --max-time 30 "$FRONTEND_URL/")
          if echo "$html" | grep -q 'id="root"'; then
            echo "✅ GET $FRONTEND_URL/ trả trang React"
          else
            echo "::error::GET $FRONTEND_URL/ không phải trang React (sai URL frontend? build chưa đúng?)"
            exit 1
          fi
        fi

        # ---- 3. Detections -> History ------------------------------------
        if [ "$CHECK_DETECTIONS" = "true" ]; then
          img="$RUNNER_TEMP/leaf.png"
          # Ảnh PNG 64x64 màu xanh lá, tạo bằng thư viện chuẩn Python (không cần Pillow)
          python3 - "$img" <<'PY'
        import struct, sys, zlib
        w = h = 64
        raw = b"".join(b"\x00" + bytes((60, 150, 60)) * w for _ in range(h))
        def chunk(t, d):
            return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xFFFFFFFF)
        png = (b"\x89PNG\r\n\x1a\n"
               + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
               + chunk(b"IDAT", zlib.compress(raw))
               + chunk(b"IEND", b""))
        open(sys.argv[1], "wb").write(png)
        PY

          # Lớp 0 luôn tồn tại trong class_mapping; model_version lấy từ /health
          mv=$(cat "$RUNNER_TEMP/health.json" | json 'd.get("model_version") or "smoke-test"')
          resp=$(curl -fsS --max-time 60 \
                  -F "category_id=0" -F "confidence_score=0.91" -F "model_version=$mv" \
                  -F "file=@$img;type=image/png" "$API_URL/api/detections")
          echo "✅ POST /api/detections: $(echo "$resp" | json 'd["class_name"], d["confidence_score"], d["model_version"]')"

          rec_id=$(echo "$resp" | json 'd.get("id")')
          if [ "$rec_id" = "None" ]; then
            echo "::error::Backend không trả id -> kết quả chưa được lưu vào DB"
            exit 1
          fi

          hist=$(curl -fsS --max-time 30 "$API_URL/api/history?limit=5")
          if echo "$hist" | python3 -c "import sys, json; ids = [i['id'] for i in json.load(sys.stdin)['items']]; sys.exit(0 if $rec_id in ids else 1)"; then
            echo "✅ GET /api/history có bản ghi id=$rec_id"
          else
            echo "::error::Không thấy bản ghi id=$rec_id trong /api/history"
            exit 1
          fi

          code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "$API_URL/api/history/$rec_id")
          if [ "$code" = "204" ]; then
            echo "🧹 Đã xoá bản ghi test id=$rec_id"
          else
            echo "::warning::Không xoá được bản ghi test id=$rec_id (HTTP $code)"
          fi
        fi

        echo "🎉 Smoke test passed"
