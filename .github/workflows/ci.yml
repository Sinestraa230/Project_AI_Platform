# =====================================================================
# TẦNG 1 — CI: kiểm tra TỪNG VAI TRÒ, độc lập với nhau
#
# Chạy cho: mọi Pull Request vào main + mọi lần push lên main.
#   Backend  · pytest            — code backend (SQLite tạm; backend không chạy model)
#   Frontend · lint, test, build — code frontend (không tải model 43MB khi build)
#   Database · migrations + seed — file migration của DBA chạy được trên Postgres trống
#   Docker   · build backend     — backend/Dockerfile build được (không push)
#   Docker   · build frontend    — frontend/Dockerfile build được (context = gốc repo)
#
# Đặt các job trên làm "required status checks" của nhánh main (bật dần khi đã xanh).
# Kiểm tra sự liên kết giữa các vai trò nằm ở integration.yml (tầng 2).
# =====================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cài Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # giống Python runtime của Vercel và image Docker
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Chạy pytest
        run: python -m pytest -q -rs

  # -------------------------------------------------------------------
  frontend:
    name: Frontend · lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cài Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài thư viện
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        # Chạy nếu package.json có script "test" (FE thêm Vitest), chưa có thì bỏ qua
        run: npm run test --if-present

      - name: Build
        # prebuild (scripts/prepare-model.mjs) vẫn chạy: kiểm tra metadata model +
        # chép runtime LiteRT.js; chỉ bỏ bước tải file .tflite 43MB
        env:
          SKIP_MODEL_DOWNLOAD: "1"
        run: npm run build

  # -------------------------------------------------------------------
  database:
    name: Database · migrations + seed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Áp migration + seed lên DB trống
        uses: ./.github/actions/db-migrate
        with:
          database-url: ${{ env.DATABASE_URL }}
          apply-seed: "true"

      - name: Chạy lại lần 2 (phải bỏ qua hết, không lỗi)
        uses: ./.github/actions/db-migrate
        with:
          database-url: ${{ env.DATABASE_URL }}
          apply-seed: "true"

      - name: In danh sách bảng
        run: |
          psql "$DATABASE_URL" -c '\dt'
          psql "$DATABASE_URL" -c 'SELECT * FROM schema_migrations ORDER BY applied_at'

  # -------------------------------------------------------------------
  docker:
    name: Docker · build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile
            build-args: ""
          - image: frontend
            context: .                      # cần backend/app/data/model/ lúc build
            dockerfile: frontend/Dockerfile
            build-args: SKIP_MODEL_DOWNLOAD=1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kiểm tra docker-compose.yml hợp lệ
        if: matrix.image == 'backend'
        env:
          POSTGRES_PASSWORD: ci-dummy
        run: |
          docker compose config --quiet
          docker compose --project-directory . -f docker/docker-compose.dev.yml config --quiet

      - name: Cài Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (không push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          build-args: ${{ matrix.build-args }}
          tags: plant-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
