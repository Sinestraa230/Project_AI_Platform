# =====================================================================
# TẦNG 1 — CI: kiểm tra TỪNG VAI TRÒ, độc lập với nhau
#
# Chạy cho: mọi Pull Request vào main + mọi lần push lên main.
# 4 job song song, job nào chỉ kiểm tra phần của vai trò đó:
#   Backend  · pytest          — code backend (DB SQLite tạm; backend không chạy model)
#   Frontend · lint/test/build — code frontend (không tải model 43MB khi build)
#   Database · migrations      — migration + seed chạy được trên Postgres trống
#   Docker   · build image     — Dockerfile build được (CHƯA có Dockerfile thì bỏ qua, không chặn)
#
# Đặt cả 4 job làm "required status checks" của nhánh main.
# Kiểm tra sự liên kết giữa các vai trò nằm ở integration.yml (tầng 2).
# =====================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Push liên tục lên cùng 1 nhánh -> huỷ lần chạy cũ, chỉ giữ lần mới nhất
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Thiết kế: 1 Dockerfile ở thư mục gốc (build FE rồi gộp vào image backend)
  DOCKER_CONTEXT: .
  DOCKERFILE: Dockerfile

jobs:
  # -------------------------------------------------------------------
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cài Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # giống Python mặc định của Vercel
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Model chạy trên trình duyệt -> backend chỉ đọc metadata trong app/data/model/,
      # không cần tải model. conftest.py tự dùng SQLite + thư mục ảnh tạm.
      - name: Chạy pytest
        run: python -m pytest -q -rs

  # -------------------------------------------------------------------
  frontend:
    name: Frontend · lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cài Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài thư viện
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        # Chạy nếu package.json có script "test" (FE thêm Vitest), chưa có thì bỏ qua
        run: npm run test --if-present

      - name: Build
        # prebuild (scripts/prepare-model.mjs) vẫn chạy: kiểm tra metadata model +
        # chép runtime LiteRT.js; chỉ bỏ bước tải file .tflite 43MB
        env:
          SKIP_MODEL_DOWNLOAD: "1"
        run: npm run build

  # -------------------------------------------------------------------
  database:
    name: Database · migrations + seed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Áp migration + seed lên DB trống
        uses: ./.github/actions/db-migrate
        with:
          database-url: ${{ env.DATABASE_URL }}
          apply-seed: "true"

      - name: Chạy lại lần 2 (phải bỏ qua hết, không lỗi)
        uses: ./.github/actions/db-migrate
        with:
          database-url: ${{ env.DATABASE_URL }}
          apply-seed: "true"

      - name: In danh sách bảng
        run: |
          psql "$DATABASE_URL" -c '\dt'
          psql "$DATABASE_URL" -c 'SELECT * FROM schema_migrations ORDER BY applied_at'

  # -------------------------------------------------------------------
  docker:
    name: Docker · build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kiểm tra file Docker đã có chưa
        id: files
        run: |
          [ -f "$DOCKERFILE" ]          && echo "dockerfile=true" >> "$GITHUB_OUTPUT" \
            || echo "::warning::Chưa có $DOCKERFILE — bỏ qua bước build (vai trò Docker chưa hoàn thiện)."
          [ -f docker-compose.yml ]     && echo "compose=true"    >> "$GITHUB_OUTPUT" \
            || echo "::warning::Chưa có docker-compose.yml — bỏ qua bước kiểm tra compose."

      - name: Kiểm tra docker-compose.yml hợp lệ
        if: steps.files.outputs.compose == 'true'
        env:
          POSTGRES_PASSWORD: ci-dummy
        run: docker compose config --quiet

      - name: Cài Docker Buildx
        if: steps.files.outputs.dockerfile == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image (không push)
        if: steps.files.outputs.dockerfile == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKER_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          push: false
          tags: plant-disease-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
