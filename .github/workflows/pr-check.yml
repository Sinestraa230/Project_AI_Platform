name: Pull Request Check

# Merge vào main = deploy thật (Vercel tự build lại frontend và backend),
# nên mọi PR phải qua test backend + lint/build frontend trước.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # giống Python mặc định của Vercel
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Backend không chạy model (model chạy trên trình duyệt) -> không cần tải gì;
      # conftest.py dùng SQLite tạm.
      - name: Run tests
        run: python -m pytest -q -rs

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Không tải model 43MB ở CI: chỉ kiểm tra build + manifest + runtime LiteRT.js
      - name: Build
        run: npm run build
        env:
          SKIP_MODEL_DOWNLOAD: "1"
          VITE_API_URL: https://example-backend.vercel.app
