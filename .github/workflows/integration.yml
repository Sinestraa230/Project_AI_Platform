# =====================================================================
# TẦNG 2 — INTEGRATION: kiểm tra SỰ LIÊN KẾT giữa các vai trò
#
# Chạy khi: mở/cập nhật PR vào main · CI trên main PASS (nối tiếp) · chạy tay.
#
#   Backend ↔ Database    backend chạy thật trên PostgreSQL 16 (driver psycopg2, tự tạo bảng),
#                         ghi 1 kết quả chẩn đoán qua /api/detections -> đọc lại ở /api/history.
#                         Thêm bước so sánh bảng backend tạo với migration của DBA (chỉ cảnh báo).
#   Docker (FE+BE+DB)     docker compose up toàn hệ thống từ 2 Dockerfile, kiểm tra đầu-cuối
#                         qua nginx (:3000) -> backend -> Postgres.
#
# Trên main: Integration pass -> deploy.yml (tầng 3) tự chạy.
# =====================================================================
name: Integration

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: integration-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Commit cần kiểm tra: commit đã qua CI (workflow_run) hoặc commit hiện tại
  CHECK_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # -------------------------------------------------------------------
  backend-database:
    name: Tích hợp · Backend ↔ Database
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/app_db
      IMAGE_STORAGE: db
      CORS_ORIGINS: "*"
      APP_ENV: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECK_SHA }}

      - name: Cài Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Cài thư viện backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "[BE] Có driver PostgreSQL trong requirements"
        run: |
          python -c "import psycopg2" 2>/dev/null || {
            echo "::error::backend/requirements.txt thiếu psycopg2-binary -> backend không kết nối được PostgreSQL"
            exit 1
          }

      - name: Khởi động backend trên PostgreSQL (backend tự tạo bảng)
        working-directory: backend
        run: nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &

      - name: Detections -> lưu DB -> đọc history
        uses: ./.github/actions/smoke-api
        with:
          api-url: http://127.0.0.1:8000
          wait-seconds: "120"
          check-frontend: "false"     # FE chỉ được phục vụ cùng BE khi chạy bằng Docker (job sau)
          check-detections: "true"

      - name: "[BE ↔ DBA] So sánh bảng backend tạo với migration của DBA (cảnh báo)"
        run: |
          be_tables=$(psql "$DATABASE_URL" -tAc \
            "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY 1")
          echo "Bảng backend tạo:"; echo "$be_tables"
          missing=""
          for t in $be_tables; do
            grep -rqiE "create table( if not exists)? +\"?$t\"?" database/migrations/ || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Schema lệch giữa BE và DBA::Backend tự tạo bảng chưa có trong database/migrations/:$missing. BE và DBA cần thống nhất một schema (xem docker/README.md, mục Migration)."
          else
            echo "✅ Mọi bảng backend dùng đều có trong migration"
          fi

      - name: Log backend
        if: always()
        run: tail -n 200 "$RUNNER_TEMP/backend.log" || true

  # -------------------------------------------------------------------
  docker-e2e:
    name: Tích hợp · Docker (FE + BE + DB)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-integration
      SKIP_MODEL_DOWNLOAD: "1"     # không tải model 43MB trong CI; API không cần model
      APP_PORT: "3000"
      API_PORT: "8000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECK_SHA }}

      - name: docker compose up (build 2 image + chờ healthy)
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Kiểm tra đầu-cuối qua nginx (:3000 -> backend -> Postgres)
        uses: ./.github/actions/smoke-api
        with:
          api-url: http://localhost:3000       # nginx proxy /api, /health sang backend
          frontend-url: http://localhost:3000
          wait-seconds: "120"
          check-frontend: "true"
          check-detections: "true"

      - name: Backend cũng trả lời trực tiếp ở :8000
        run: curl -fsS http://127.0.0.1:8000/health

      - name: "[DBA ↔ Docker] Bảng trong Postgres của compose"
        run: docker compose exec -T db psql -U postgres -d plantdb -c '\dt'

      - name: Log khi lỗi
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Dọn dẹp
        if: always()
        run: docker compose down -v
