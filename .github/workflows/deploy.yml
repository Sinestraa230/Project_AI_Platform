# =====================================================================
# TẦNG 3 — CD: Build & push Docker Hub → Deploy Vercel (backend + frontend) → Smoke test
#
# Chuỗi trên main:  CI (từng vai trò) ─pass→ Integration (liên kết) ─pass→ CD (deploy)
# Tự chạy khi workflow "Integration" chạy XONG và PASS trên main.
# Chạy tay: tab Actions → CD → Run workflow (deploy lại commit mới nhất của main).
#
# Vercel KHÔNG tự deploy khi merge nữa (vercel.json: git.deploymentEnabled.main=false);
# việc deploy do workflow này làm bằng Vercel CLI, nên luôn đi sau test + build.
#
# Cần cấu hình trong Settings → Secrets and variables → Actions:
#   Secrets:   DOCKERHUB_TOKEN, VERCEL_TOKEN, VERCEL_ORG_ID,
#              VERCEL_PROJECT_ID_BACKEND, VERCEL_PROJECT_ID_FRONTEND
#   Variables: DOCKERHUB_USERNAME, BACKEND_URL, FRONTEND_URL
# (orgId/projectId lấy trong backend/.vercel/project.json và frontend/.vercel/project.json
#  sau khi `vercel link`, hoặc Vercel → Project → Settings → General.)
# =====================================================================
name: CD

on:
  workflow_run:
    workflows: [Integration]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Không cho 2 lần deploy chạy chồng nhau; lần sau xếp hàng chờ lần trước
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Commit đã qua CI + Integration (workflow_run) hoặc commit mới nhất (chạy tay)
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # -------------------------------------------------------------------
  build-push:
    name: Docker Hub · ${{ matrix.image }}
    # Chỉ deploy khi Integration pass và không phải lần chạy của Pull Request
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile
          - image: frontend
            context: .
            dockerfile: frontend/Dockerfile
    steps:
      - name: Checkout đúng commit đã qua kiểm tra
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Tính tag image
        id: tag
        run: echo "short=sha-${DEPLOY_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Cài Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push (tag sha-xxxxxxx để rollback + latest)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          # Image frontend: không nhúng VITE_API_URL -> dùng được ở mọi nơi qua nginx proxy
          # (BACKEND_UPSTREAM lúc chạy). Model được tải vào image (repo HF public).
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/plant-${{ matrix.image }}:${{ steps.tag.outputs.short }}
            ${{ vars.DOCKERHUB_USERNAME }}/plant-${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # -------------------------------------------------------------------
  deploy-vercel:
    name: Vercel · ${{ matrix.project }}
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: backend
            project-id-secret: VERCEL_PROJECT_ID_BACKEND
          - project: frontend
            project-id-secret: VERCEL_PROJECT_ID_FRONTEND
    environment:
      name: production-${{ matrix.project }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project-id-secret] }}
    steps:
      - name: Checkout đúng commit đã qua kiểm tra
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Cài Node 22 + Vercel CLI
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global vercel@latest

      - name: Kiểm tra secrets
        run: |
          [ -n "$VERCEL_TOKEN" ]      || { echo "::error::Thiếu secret VERCEL_TOKEN"; exit 1; }
          [ -n "$VERCEL_ORG_ID" ]     || { echo "::error::Thiếu secret VERCEL_ORG_ID"; exit 1; }
          [ -n "$VERCEL_PROJECT_ID" ] || { echo "::error::Thiếu secret ${{ matrix.project-id-secret }}"; exit 1; }

      # Chạy từ GỐC REPO: project trên Vercel đã đặt Root Directory = backend / frontend,
      # CLI upload cả repo (trừ .vercelignore) và Vercel build đúng thư mục đó với
      # Environment Variables đã cấu hình trên dashboard (DATABASE_URL, VITE_API_URL...).
      - name: vercel deploy --prod
        id: deploy
        run: |
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" \
                  --meta gitCommitSha="$DEPLOY_SHA" --meta gitCommitRef=main 2> "$RUNNER_TEMP/vercel.log")
          cat "$RUNNER_TEMP/vercel.log"
          echo "Deployment: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------
  smoke-test:
    name: Smoke test (Live)
    needs: deploy-vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (lấy action smoke-api)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Kiểm tra bản production
        uses: ./.github/actions/smoke-api
        with:
          api-url: ${{ vars.BACKEND_URL }}
          frontend-url: ${{ vars.FRONTEND_URL }}
          wait-seconds: "300"
          check-frontend: "true"
          # Không tạo bản ghi rác trên production; đổi thành "true" nếu muốn thử cả luồng ghi/đọc DB
          check-detections: "false"

      - name: Ghi tóm tắt deploy
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          {
            echo "## 🚀 Deploy thành công"
            echo "- Frontend: ${FRONTEND_URL}"
            echo "- Backend: ${BACKEND_URL}  (health: \`$(cat "$RUNNER_TEMP/health.json")\`)"
            echo "- Docker Hub: \`${DOCKERHUB_USERNAME}/plant-backend:sha-${DEPLOY_SHA::7}\`, \`${DOCKERHUB_USERNAME}/plant-frontend:sha-${DEPLOY_SHA::7}\`"
            echo "- Commit: \`${DEPLOY_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
