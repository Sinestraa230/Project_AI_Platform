# =====================================================================
# TẦNG 3 — CD: Build & push Docker Hub → Migrate DB → Deploy Render → Smoke test
#
# Chuỗi trên main:  CI (từng vai trò) ─pass→ Integration (liên kết) ─pass→ CD (deploy)
# Tự chạy khi workflow "Integration" chạy XONG và PASS trên main.
# Có thể chạy tay: tab Actions → CD → Run workflow (deploy commit mới nhất của main).
#
# Cần cấu hình trong Settings → Secrets and variables → Actions:
#   Secrets:   DOCKERHUB_TOKEN, DATABASE_URL, RENDER_DEPLOY_HOOK_URL
#   Variables: DOCKERHUB_USERNAME, APP_URL   (tuỳ chọn: APPLY_SEED)
# =====================================================================
name: CD

on:
  workflow_run:
    workflows: [Integration]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Không cho 2 lần deploy chạy chồng nhau; lần sau xếp hàng chờ lần trước
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/plant-disease-app
  # Phải giống ci.yml
  DOCKER_CONTEXT: .
  DOCKERFILE: Dockerfile
  # Commit đã qua CI + Integration (workflow_run) hoặc commit mới nhất (chạy tay)
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # -------------------------------------------------------------------
  build-push:
    name: Build & push Docker Hub
    # Chỉ deploy khi Integration pass, và không phải lần chạy của Pull Request
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout đúng commit đã qua kiểm tra
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Đặt tên image
        id: meta
        run: echo "image=${IMAGE_NAME}:sha-${DEPLOY_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Cài Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKER_CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64        # Render chỉ chạy image linux/amd64
          push: true
          # 2 tag: sha-xxxxxxx (cố định, để rollback) + latest
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------
  migrate:
    name: Migrate PostgreSQL
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout đúng commit đã qua kiểm tra
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Áp migration lên DB production (Neon)
        uses: ./.github/actions/db-migrate
        with:
          database-url: ${{ secrets.DATABASE_URL }}
          # Seed chạy đúng 1 lần ở lần deploy đầu; đặt biến APPLY_SEED=false nếu không muốn seed
          apply-seed: ${{ vars.APPLY_SEED || 'true' }}

  # -------------------------------------------------------------------
  deploy:
    name: Deploy Render
    needs: [build-push, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Gọi Render deploy hook với đúng image vừa push
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.build-push.outputs.image }}
        run: |
          # imgURL phải URL-encode, và phần trước tag phải giống image cấu hình trên Render
          IMG_URL=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote("docker.io/" + sys.argv[1], safe=""))' "$IMAGE")
          curl -fsS -X POST "${HOOK_URL}&imgURL=${IMG_URL}"
          echo
          echo "Đã yêu cầu Render deploy $IMAGE"

  # -------------------------------------------------------------------
  smoke-test:
    name: Smoke test (Live)
    needs: [build-push, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (lấy action smoke-api)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Chờ Render kéo image mới
        run: sleep 90

      - name: Kiểm tra bản đang chạy trên Render
        uses: ./.github/actions/smoke-api
        with:
          base-url: ${{ vars.APP_URL }}
          wait-seconds: "720"
          check-frontend: "true"
          # Không tạo bản ghi rác trên production; đổi thành "true" nếu muốn thử cả predict
          check-predict: "false"

      - name: Ghi tóm tắt deploy
        env:
          APP_URL: ${{ vars.APP_URL }}
          IMAGE: ${{ needs.build-push.outputs.image }}
        run: |
          {
            echo "## 🚀 Deploy thành công"
            echo "- URL: ${APP_URL}"
            echo "- Image: \`${IMAGE}\`"
            echo "- Commit: \`${DEPLOY_SHA}\`"
            echo "- /health: \`$(cat "$RUNNER_TEMP/health.json")\`"
          } >> "$GITHUB_STEP_SUMMARY"
