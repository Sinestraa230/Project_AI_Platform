server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Chuyển các request /api sang backend (tên "backend" là tên service trong docker-compose).
    # Nhờ vậy trình duyệt chỉ gọi cùng một địa chỉ, không gặp lỗi CORS.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Ảnh upload để nhận diện có thể lớn
        client_max_body_size 20M;
    }

    # Ứng dụng React một trang: đường dẫn nào không có file thật thì trả về index.html
    location / {
        try_files $uri /index.html;
    }
}