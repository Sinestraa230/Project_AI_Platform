# =====================================================================
# Chạy cả hệ thống ở máy, tách giống cách deploy trên Vercel:
#   - frontend: file tĩnh (nginx)      -> http://localhost:8080
#   - backend : FastAPI                -> http://localhost:8000/health
#   - db      : PostgreSQL (thay Neon)
#
# Cách chạy:
#   1. copy .env.example -> .env ở thư mục gốc, điền POSTGRES_PASSWORD
#   2. docker compose up --build
#   3. mở http://localhost:8080
#
# Xoá sạch DB để tạo lại từ đầu:  docker compose down -v
#
# Bảng trong DB do backend tự tạo khi khởi động (SQLAlchemy create_all),
# giống trên Vercel/Neon. KHÔNG mount database/*.sql vào Postgres: các file
# đó tạo bảng users/sessions khác cấu trúc với backend -> đăng nhập sẽ lỗi.
# =====================================================================
name: plant-disease

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Hãy đặt POSTGRES_PASSWORD trong file .env}
      POSTGRES_DB: ${POSTGRES_DB:-pestdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Chỉ mở cho máy mình (để xem DB bằng DBeaver/pgAdmin)
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pestdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      # Trong compose gọi DB bằng tên service "db", không dùng localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pestdb}
      CORS_ORIGINS: http://localhost:${FE_PORT:-8080}
      # Trong Docker không có VERCEL=1 nên phải đặt rõ (giống Vercel: lưu ảnh vào DB)
      IMAGE_STORAGE: db
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        # Gắn vào code lúc build; request đi từ trình duyệt nên dùng localhost.
        # Đổi cổng backend thì phải build lại: docker compose up --build
        VITE_API_URL: http://localhost:${APP_PORT:-8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FE_PORT:-8080}:80"

volumes:
  pgdata:
