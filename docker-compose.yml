# =====================================================================
# Chạy TOÀN BỘ hệ thống trên máy cá nhân bằng Docker: PostgreSQL + backend + frontend.
#
#   1. copy .env.example -> .env ở gốc repo, điền ít nhất POSTGRES_PASSWORD
#   2. docker compose up --build
#   3. mở http://localhost:3000   (API: http://localhost:8000/docs)
#
# Xoá sạch dữ liệu để làm lại từ đầu:  docker compose down -v
# Chỉ cần Postgres (chạy FE/BE bằng npm/uvicorn): xem docker/docker-compose.dev.yml
# Chi tiết: docker/README.md
# =====================================================================
name: plant-disease

services:
  # ------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Hãy đặt POSTGRES_PASSWORD trong file .env ở gốc repo}
      POSTGRES_DB: ${POSTGRES_DB:-plantdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migration/seed của DBA có sẵn trong container để chạy tay khi cần:
      #   docker compose exec db psql -U postgres -d plantdb -f /database/migrations/V1__init_db.sql
      # (Backend hiện tự tạo bảng lúc khởi động, nên không chạy tự động ở đây.)
      - ./database:/database:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-plantdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    image: ${DOCKERHUB_USERNAME:-local}/plant-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: "8000"
      # Gọi DB bằng tên service "db", không phải localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-plantdb}
      # Ảnh lưu trong DB để không mất khi container bị tạo lại
      IMAGE_STORAGE: ${IMAGE_STORAGE:-db}
      # FE gọi API qua nginx cùng origin nên CORS không cần thiết; để * cho tiện gọi thẳng :8000
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.6}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ------------------------------------------------------------------
  frontend:
    build:
      context: .                    # gốc repo: cần backend/app/data/model/ lúc build
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""            # trống = gọi /api cùng origin, nginx proxy sang backend
        SKIP_MODEL_DOWNLOAD: ${SKIP_MODEL_DOWNLOAD:-}
    image: ${DOCKERHUB_USERNAME:-local}/plant-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_UPSTREAM: http://backend:8000
    ports:
      - "${APP_PORT:-3000}:80"

volumes:
  pgdata:
