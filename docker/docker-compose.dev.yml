# =====================================================================
# CHỈ PostgreSQL — cho ai muốn chạy backend bằng uvicorn và frontend bằng npm run dev
# nhưng vẫn cần một DB Postgres thật (giống production) thay vì SQLite.
#
# Chạy từ GỐC REPO (để đọc được .env và thư mục database/):
#   docker compose --project-directory . -f docker/docker-compose.dev.yml up -d
# Dừng:                   docker compose --project-directory . -f docker/docker-compose.dev.yml down
# Xoá cả dữ liệu:          ... down -v
#
# Sau đó trong .env đặt:
#   DATABASE_URL=postgresql://postgres:<POSTGRES_PASSWORD>@localhost:5432/plantdb
# rồi chạy backend như bình thường:  cd backend && uvicorn app.main:app --reload
# =====================================================================
name: plant-disease-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Hãy đặt POSTGRES_PASSWORD trong file .env ở gốc repo}
      POSTGRES_DB: ${POSTGRES_DB:-plantdb}
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./database:/database:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-plantdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata-dev:
